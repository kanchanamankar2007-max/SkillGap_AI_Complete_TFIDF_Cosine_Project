<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | SkillGap AI</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fc;font-family:Arial,sans-serif;color:#1e3154;padding:20px}
.card{width:100%;max-width:440px;background:white;padding:32px;border-radius:16px;box-shadow:0 12px 35px #1e31541a}
h1{margin-top:0;color:#15356d}p{color:#66758d}.field{margin:16px 0}label{display:block;font-weight:600;margin-bottom:7px}input,select{width:100%;padding:12px;border:1px solid #ccd5e4;border-radius:8px;font-size:15px}
button{width:100%;padding:13px;background:#2459c5;color:white;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px}
.error{padding:10px;background:#fff0f0;color:#b42318;border-radius:7px}.links{margin-top:20px;text-align:center}a{color:#2459c5}
</style></head><body><main class="card"><h1>Create Learner Account</h1><p>Register to save analysis reports and track your career progress.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><div class="field"><label>Full name</label><input name="name" required maxlength="100" autocomplete="name"></div><div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div><div class="field"><label>Password (minimum 8 characters)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label>Target job role</label><select name="job_role" required><option value="">Select a role</option>{% for role in job_roles %}<option value="{{ role }}">{{ role }}</option>{% endfor %}</select></div><button type="submit">Create account</button></form><div class="links">Already registered? <a href="{{ url_for('login') }}">Log in</a><br><a href="{{ url_for('home') }}">Back to SkillGap AI</a></div></main></body></html>
